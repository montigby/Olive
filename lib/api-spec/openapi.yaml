openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FamilyBranch API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: persons
    description: Person profile operations
  - name: family-units
    description: Family unit operations
  - name: members
    description: Member management within a unit
  - name: invites
    description: Invite link operations
  - name: link-requests
    description: Unit linking operations
  - name: family-groups
    description: Extended family group operations
  - name: summary
    description: Summary and dashboard data
  - name: life-events
    description: Life event operations (graduations, marriages, moves, etc.)
  - name: memories
    description: Memories-of-the-deceased operations
  - name: home-feed
    description: Post-invite welcome / home-feed dashboard data
  - name: ai
    description: AI chat assistant operations
  - name: invite-flow
    description: Shared-invite-link + claim-request system (phase 2 invite flow)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Waitlist ───────────────────────────────────────────────────
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistBody"
      responses:
        "201":
          description: Added to the waitlist (idempotent -- re-submitting the same email is not an error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Auth ───────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated person
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithUnit"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current account's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: New password must be at least 8 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password-reset email
      description: >-
        Always returns 200 with the same generic message whether or not the
        email is registered, to avoid leaking account existence. If the
        account exists, a single-use reset link is emailed to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Generic acknowledgement (does not reveal whether the email is registered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using an emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Token missing, invalid, expired, already used, or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Persons ────────────────────────────────────────────────────
  /persons/{personId}:
    get:
      operationId: getPerson
      tags: [persons]
      summary: Get a person profile
      parameters:
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updatePerson
      tags: [persons]
      summary: Update a person's own profile
      parameters:
        - $ref: "#/components/parameters/personId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonBody"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePerson
      tags: [persons]
      summary: Remove a person from the unit (admin) or delete own profile (member)
      parameters:
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /persons/{personId}/admin:
    patch:
      operationId: updatePersonAdmin
      tags: [persons]
      summary: Grant or revoke admin rights for a claimed member (admin only, same unit)
      parameters:
        - $ref: "#/components/parameters/personId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonAdminBody"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: isAdmin must be a boolean, or the target profile isn't claimed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden -- target person is not in the caller's family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot remove the last admin in a family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Family Units ────────────────────────────────────────────────
  /family-units:
    post:
      operationId: createFamilyUnit
      tags: [family-units]
      summary: Create a new family unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyUnitBody"
      responses:
        "201":
          description: Family unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyUnit"

  /family-units/search:
    get:
      operationId: searchFamilyUnits
      tags: [family-units]
      summary: Search family units by name or unit code
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyUnitSummary"

  /family-units/{unitId}:
    get:
      operationId: getFamilyUnit
      tags: [family-units]
      summary: Get a family unit with its members
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyUnitWithMembers"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateFamilyUnit
      tags: [family-units]
      summary: Update family unit name or details (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyUnitBody"
      responses:
        "200":
          description: Updated unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyUnit"

  # ─── Members ─────────────────────────────────────────────────────
  /family-units/{unitId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all members of a family unit
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"

    post:
      operationId: addMember
      tags: [members]
      summary: Add a placeholder member to the unit (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberBody"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /family-units/{unitId}/relationships:
    get:
      operationId: listUnitRelationships
      tags: [members]
      summary: Get all explicit relationship edges for a family unit
      description: >-
        Edge direction for parent-type edges is from_person = child,
        to_person = parent (see relationships table convention).
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Relationship edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationshipEdge"
        "403":
          description: Forbidden -- caller is not a member of this unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Invites ─────────────────────────────────────────────────────
  /family-units/{unitId}/members/{personId}/invite:
    post:
      operationId: generateInvite
      tags: [invites]
      summary: Generate or regenerate an invite link for a member (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"

  /invites/{token}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Look up an invite by token (public — no auth required)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteDetails"
        "404":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}/claim:
    post:
      operationId: claimProfile
      tags: [invites]
      summary: Claim a profile via invite token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProfileBody"
      responses:
        "200":
          description: Profile claimed and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}/merge/preview:
    post:
      operationId: previewInviteMerge
      tags: [invites]
      summary: >-
        Preview merging an invited placeholder profile into the invitee's
        existing Olive account (re-authenticates the existing account by
        email/password; does not write anything yet)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewInviteMergeBody"
      responses:
        "200":
          description: Merge preview -- the placeholder and the matched existing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewInviteMergeResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password for the existing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}/merge/confirm:
    post:
      operationId: confirmInviteMerge
      tags: [invites]
      summary: Confirm the merge previewed above and log in as the merged account
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInviteMergeBody"
      responses:
        "200":
          description: Merge completed and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmInviteMergeResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password for the existing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Merge conflict (e.g. already merged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Link Requests ────────────────────────────────────────────────
  /family-units/{unitId}/link-requests:
    post:
      operationId: createLinkRequest
      tags: [link-requests]
      summary: Send a link request to a parent unit (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequestBody"
      responses:
        "201":
          description: Link request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"

    get:
      operationId: listLinkRequests
      tags: [link-requests]
      summary: List pending link requests for a unit (incoming and outgoing)
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Link requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequestsResponse"

  /link-requests/{requestId}/accept:
    post:
      operationId: acceptLinkRequest
      tags: [link-requests]
      summary: Accept a link request (parent unit admin)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Link accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"

  /link-requests/{requestId}/decline:
    post:
      operationId: declineLinkRequest
      tags: [link-requests]
      summary: Decline a link request (parent unit admin)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Link declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"

  # ─── Family Groups ────────────────────────────────────────────────
  /family-units/{unitId}/tree:
    get:
      operationId: getFamilyTree
      tags: [family-groups]
      summary: Get the full family tree for a unit (unit + all linked units)
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Family tree data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"

  # ─── Summary / Dashboard ─────────────────────────────────────────
  /family-units/{unitId}/summary:
    get:
      operationId: getUnitSummary
      tags: [summary]
      summary: Get dashboard summary stats for a unit
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitSummary"

  /family-units/{unitId}/birthdays:
    get:
      operationId: getUpcomingBirthdays
      tags: [summary]
      summary: Get upcoming birthdays in the unit and linked units
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Upcoming birthdays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BirthdayEntry"

  # ─── Life Events ─────────────────────────────────────────────────
  /persons/{personId}/life-events:
    get:
      operationId: listLifeEvents
      tags: [life-events]
      summary: List life events for a person (same family unit only)
      parameters:
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Life events, sorted by event date ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifeEvent"
        "403":
          description: Forbidden -- viewer is not in the target's family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createLifeEvent
      tags: [life-events]
      summary: Log a life event for a person (admin, parent of the person, or self)
      parameters:
        - $ref: "#/components/parameters/personId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifeEventBody"
      responses:
        "201":
          description: Life event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /life-events/{eventId}:
    patch:
      operationId: updateLifeEvent
      tags: [life-events]
      summary: >-
        Update a life event (creator, same-family admin, or a parent of the
        event's subject)
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLifeEventBody"
      responses:
        "200":
          description: Updated life event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Life event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteLifeEvent
      tags: [life-events]
      summary: >-
        Delete a life event (creator, same-family admin, or a parent of the
        event's subject)
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Life event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Memories ────────────────────────────────────────────────────
  /persons/{personId}/memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: >-
        List memories about a (typically deceased) person, visible to the
        whole family unit
      parameters:
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Memories, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryWithContributor"
        "403":
          description: Forbidden -- viewer is not in the target's family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createMemory
      tags: [memories]
      summary: >-
        Contribute a memory about a person. Requires memory collection to be
        turned on for that profile
      parameters:
        - $ref: "#/components/parameters/personId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryBody"
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          description: >-
            Validation error, or memory collection isn't turned on for this
            profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden -- contributor is not in the target's family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /memories/{memoryId}:
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory (contributor only)
      parameters:
        - $ref: "#/components/parameters/memoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryBody"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden -- you can only edit your own memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory (contributor or same-family admin)
      parameters:
        - $ref: "#/components/parameters/memoryId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /persons/{personId}/memory-collection:
    post:
      operationId: setMemoryCollectionEnabled
      tags: [memories]
      summary: >-
        Turn memory collection on (any family member, deceased profiles
        only) or off (admin only) for a person
      parameters:
        - $ref: "#/components/parameters/personId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemoryCollectionBody"
      responses:
        "200":
          description: Updated memory-collection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCollectionToggleResponse"
        "400":
          description: >-
            enabled must be a boolean, or the profile isn't marked deceased
            yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /persons/{personId}/memory-prompts/optout:
    post:
      operationId: optOutOfMemoryPrompts
      tags: [memories]
      summary: >-
        Stop future memory-prompt emails about this specific deceased
        person for the caller only
      parameters:
        - $ref: "#/components/parameters/personId"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ─── Home Feed ───────────────────────────────────────────────────
  /family-units/{unitId}/home-feed:
    get:
      operationId: getHomeFeed
      tags: [home-feed]
      summary: >-
        Get all data for the post-invite welcome / home-feed screen in one
        round-trip
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Home feed data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeFeedResponse"
        "403":
          description: Forbidden -- caller is not a member of this unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unit or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── AI ──────────────────────────────────────────────────────────
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: >-
        Chat with the Olive AI assistant, which can add/update/delete family
        members, log life events, and save memories via tool calls
      description: >-
        Rate-limited to 30 requests per 15 minutes per person (or IP, if
        unauthenticated context is somehow reached).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: Assistant reply, plus any structured side effects performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden -- unitId does not match the caller's family unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests -- rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Invite Flow (phase 2: shared invite link + claim requests) ───
  /family-units/{unitId}/invite-tokens:
    post:
      operationId: regenerateInviteToken
      tags: [invite-flow]
      summary: >-
        Revoke any active shared invite token for this unit and mint a new
        one (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "201":
          description: New invite token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteTokenCreated"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: getActiveInviteToken
      tags: [invite-flow]
      summary: >-
        Get the currently-active shared invite token for this unit. Admins
        always have access; non-admins only when the unit allows
        member-sent invites
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Active invite token, or null if none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteTokenActiveResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /join/{token}:
    get:
      operationId: resolveJoinToken
      tags: [invite-flow]
      summary: >-
        Resolve a shared invite token to its family display name and
        inviter (public -- no auth required, never leaks the member list)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenInfo"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Token has been revoked, expired, or reached its use limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /claims/match:
    post:
      operationId: matchClaimCandidates
      tags: [invite-flow]
      summary: >-
        Fuzzy-match a claimer-supplied name against unclaimed, non-deceased
        people in the invite token's family (public -- no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimsMatchBody"
      responses:
        "200":
          description: >-
            Up to 4 candidates with disambiguation hints (overflow: true
            means more than 4 matched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsMatchResponse"
        "400":
          description: Token and name are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invalid, revoked, expired, or exhausted token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /claims:
    post:
      operationId: createClaimRequest
      tags: [invite-flow]
      summary: >-
        Create a claim request against an invite token, either claiming an
        existing unclaimed profile or registering as a brand-new person
        (public -- no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Claim request created, pending admin approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCreatedResponse"
        "400":
          description: Missing required fields, invalid type, or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Target profile already claimed by someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invalid, revoked, expired, or exhausted token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /claims/{claimId}:
    get:
      operationId: getClaimStatus
      tags: [invite-flow]
      summary: >-
        Poll a claim request's status by its (unguessable) id (public -- no
        auth required)
      parameters:
        - $ref: "#/components/parameters/claimId"
      responses:
        "200":
          description: Claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStatusResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /family-units/{unitId}/claims:
    get:
      operationId: listClaimRequests
      tags: [invite-flow]
      summary: List claim requests for a unit's approval inbox (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
        - name: status
          in: query
          required: false
          description: Defaults to "pending"
          schema:
            type: string
            enum: [pending, approved, rejected, superseded]
            default: pending
      responses:
        "200":
          description: >-
            Matching claim requests, with the password hash stripped from
            each claimer_signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsInboxResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /family-units/{unitId}/claims/{claimId}/approve:
    post:
      operationId: approveClaimRequest
      tags: [invite-flow]
      summary: >-
        Approve a pending claim request: materializes the account, binds
        ownership, and (for create_new) wires any attaching relationships
        (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
        - $ref: "#/components/parameters/claimId"
      responses:
        "200":
          description: Approved -- includes a fresh JWT for the newly-bound person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimApproveResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Already decided, self-approval blocked, target no longer
            claimable, or email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Claim is missing stored credentials or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /family-units/{unitId}/claims/{claimId}/reject:
    post:
      operationId: rejectClaimRequest
      tags: [invite-flow]
      summary: Reject a pending claim request (admin only)
      parameters:
        - $ref: "#/components/parameters/unitId"
        - $ref: "#/components/parameters/claimId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectClaimBody"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    personId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    unitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    memoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    claimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    # ─── Waitlist ──────────────────────────────────────────────────
    JoinWaitlistBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    JoinWaitlistResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    # ─── Auth ──────────────────────────────────────────────────────
    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        unitName:
          type: string
          description: Name of the family unit to create on registration
        relationshipLabel:
          type: string
          description: The admin's own relationship label (e.g. Mom)
      required: [email, password, firstName, lastName, unitName, relationshipLabel]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        person:
          $ref: "#/components/schemas/PersonWithUnit"
        token:
          type: string
          description: JWT session token
      required: [person, token]

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [token, newPassword]

    # ─── Person ────────────────────────────────────────────────────
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        photoUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressCity:
          type: string
          nullable: true
        addressState:
          type: string
          nullable: true
        addressZip:
          type: string
          nullable: true
        addressCountry:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        showBirthYear:
          type: boolean
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        linkedin:
          type: string
          nullable: true
        snapchat:
          type: string
          nullable: true
        venmo:
          type: string
          nullable: true
        bereal:
          type: string
          nullable: true
        otherSocial:
          type: string
          nullable: true
        relationshipLabel:
          type: string
        viewerRelationshipLabel:
          type: string
          description: >-
            The target's relationship to the currently-authenticated viewer
            (e.g. "Sibling", "Parent", "Me"), computed on read from the
            family graph. Distinct from relationshipLabel, which is a static
            string set once from the admin's perspective at creation time.
            Omitted when it can't be computed (e.g. cross-linked-unit
            viewers) -- callers should fall back to relationshipLabel.
        gender:
          type: string
          enum: [male, female]
          nullable: true
          description: >-
            Unset (null) means not specified / prefer not to say. Drives
            gendered relationship terms (e.g. "Brother" vs "Sister") in
            viewerRelationshipLabel -- neutral terms are used when null.
        parentPersonId:
          type: string
          format: uuid
          nullable: true
        familyUnitId:
          type: string
          format: uuid
        isAdmin:
          type: boolean
        claimed:
          type: boolean
        claimedAt:
          type: string
          format: date-time
          nullable: true
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
        tier2ContactField:
          type: string
          enum: [phone, email]
        confirmedMembersOnly:
          type: boolean
        hideAddress:
          type: boolean
        hideInstagram:
          type: boolean
        hideFacebook:
          type: boolean
        hideTiktok:
          type: boolean
        hideLinkedin:
          type: boolean
        hideSnapchat:
          type: boolean
        hideVenmo:
          type: boolean
        hideBereal:
          type: boolean
        hideOtherSocial:
          type: boolean
        deceased:
          type: boolean
        dateOfPassing:
          type: string
          nullable: true
        memoryCollectionEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        profileCompleteness:
          type: integer
          nullable: true
          description: >-
            0-100, +20 for each of phone/photo/email/birthday plus a 20 base.
            Only populated for admins viewing another member's card/profile
            (data-quality tool, not shown to non-admin viewers of others).
        missingPriorityField:
          type: string
          nullable: true
          enum: [phone, photo, email, birthday]
          description: The highest-priority missing field driving profileCompleteness below 100. Same audience restriction as profileCompleteness.
      required:
        - id
        - firstName
        - lastName
        - relationshipLabel
        - familyUnitId
        - isAdmin
        - claimed
        - showBirthYear
        - tier2ContactField
        - confirmedMembersOnly
        - hideAddress
        - hideInstagram
        - hideFacebook
        - hideTiktok
        - hideLinkedin
        - hideSnapchat
        - hideVenmo
        - hideBereal
        - hideOtherSocial
        - deceased
        - memoryCollectionEnabled
        - createdAt
        - updatedAt

    PersonWithUnit:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          properties:
            familyUnit:
              $ref: "#/components/schemas/FamilyUnit"
          required: [familyUnit]

    UpdatePersonBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        photoUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressCity:
          type: string
          nullable: true
        addressState:
          type: string
          nullable: true
        addressZip:
          type: string
          nullable: true
        addressCountry:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        showBirthYear:
          type: boolean
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        linkedin:
          type: string
          nullable: true
        snapchat:
          type: string
          nullable: true
        venmo:
          type: string
          nullable: true
        bereal:
          type: string
          nullable: true
        otherSocial:
          type: string
          nullable: true
        relationshipLabel:
          type: string
        gender:
          type: string
          enum: [male, female]
          nullable: true
        parentPersonId:
          type: string
          format: uuid
          nullable: true
        deceased:
          type: boolean
        dateOfPassing:
          type: string
          nullable: true
        tier2ContactField:
          type: string
          enum: [phone, email]
        confirmedMembersOnly:
          type: boolean
        hideAddress:
          type: boolean
        hideInstagram:
          type: boolean
        hideFacebook:
          type: boolean
        hideTiktok:
          type: boolean
        hideLinkedin:
          type: boolean
        hideSnapchat:
          type: boolean
        hideVenmo:
          type: boolean
        hideBereal:
          type: boolean
        hideOtherSocial:
          type: boolean

    UpdatePersonAdminBody:
      type: object
      properties:
        isAdmin:
          type: boolean
      required: [isAdmin]

    # ─── Family Unit ───────────────────────────────────────────────
    FamilyUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        unitName:
          type: string
        unitCode:
          type: string
        parentUnitId:
          type: string
          format: uuid
          nullable: true
        parentLinkStatus:
          type: string
          enum: [none, pending, accepted]
        parentLinkedAt:
          type: string
          format: date-time
          nullable: true
        membersCanInvite:
          type: boolean
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer
        claimedCount:
          type: integer
      required:
        - id
        - unitName
        - unitCode
        - parentLinkStatus
        - membersCanInvite
        - createdAt
        - memberCount
        - claimedCount

    FamilyUnitSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        unitName:
          type: string
        unitCode:
          type: string
        memberCount:
          type: integer
      required: [id, unitName, unitCode, memberCount]

    FamilyUnitWithMembers:
      allOf:
        - $ref: "#/components/schemas/FamilyUnit"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/Person"
          required: [members]

    CreateFamilyUnitBody:
      type: object
      properties:
        unitName:
          type: string
      required: [unitName]

    UpdateFamilyUnitBody:
      type: object
      properties:
        unitName:
          type: string
        membersCanInvite:
          type: boolean

    # ─── Members ───────────────────────────────────────────────────
    AddMemberBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        relationshipLabel:
          type: string
        gender:
          type: string
          enum: [male, female]
          nullable: true
        parentPersonId:
          type: string
          format: uuid
          nullable: true
      required: [firstName, lastName, relationshipLabel]

    RelationshipEdge:
      type: object
      description: >-
        An explicit relationship-layer edge. For parent-type edges,
        fromPerson is the child and toPerson is the parent.
      properties:
        fromPerson:
          type: string
          format: uuid
        toPerson:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - biological_parent
            - adoptive_parent
            - step_parent
            - spouse
            - ex_spouse
            - partner
      required: [fromPerson, toPerson, type]

    # ─── Invites ───────────────────────────────────────────────────
    InviteResponse:
      type: object
      properties:
        inviteToken:
          type: string
        inviteUrl:
          type: string
        inviteExpiresAt:
          type: string
          format: date-time
      required: [inviteToken, inviteUrl, inviteExpiresAt]

    InviteDetails:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        relationshipLabel:
          type: string
        unitName:
          type: string
        inviteExpiresAt:
          type: string
          format: date-time
      required: [personId, firstName, lastName, relationshipLabel, unitName, inviteExpiresAt]

    ClaimProfileBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    PreviewInviteMergeBody:
      type: object
      description: >-
        Re-authenticates the invitee's existing Olive account by email +
        password (not a new-account password minimum -- this is a login).
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    PreviewInviteMergeResponse:
      type: object
      properties:
        placeholder:
          type: object
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            relationshipLabel:
              type: string
            unitName:
              type: string
            unitId:
              type: string
              format: uuid
          required: [id, firstName, lastName, relationshipLabel, unitName, unitId]
        existingPerson:
          type: object
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              nullable: true
            familyUnitId:
              type: string
              format: uuid
          required: [id, firstName, lastName, email, familyUnitId]
      required: [placeholder, existingPerson]

    ConfirmInviteMergeBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ConfirmInviteMergeResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT session token
        person:
          $ref: "#/components/schemas/PersonWithUnit"
      required: [token, person]

    # ─── Link Requests ─────────────────────────────────────────────
    CreateLinkRequestBody:
      type: object
      properties:
        targetUnitId:
          type: string
          format: uuid
        connectorPersonId:
          type: string
          format: uuid
      required: [targetUnitId, connectorPersonId]

    LinkRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestingUnitId:
          type: string
          format: uuid
        requestingUnitName:
          type: string
        targetUnitId:
          type: string
          format: uuid
        targetUnitName:
          type: string
        connectorPersonId:
          type: string
          format: uuid
        connectorPersonName:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - requestingUnitId
        - requestingUnitName
        - targetUnitId
        - targetUnitName
        - connectorPersonId
        - connectorPersonName
        - status
        - createdAt

    LinkRequestsResponse:
      type: object
      properties:
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/LinkRequest"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/LinkRequest"
      required: [incoming, outgoing]

    # ─── Family Tree ───────────────────────────────────────────────
    FamilyTreeNode:
      type: object
      properties:
        unitId:
          type: string
          format: uuid
        unitName:
          type: string
        parentUnitId:
          type: string
          format: uuid
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        children:
          type: array
          items:
            $ref: "#/components/schemas/FamilyTreeNode"
      required: [unitId, unitName, members, children]

    FamilyTree:
      type: object
      properties:
        rootUnit:
          $ref: "#/components/schemas/FamilyTreeNode"
        totalUnits:
          type: integer
        totalMembers:
          type: integer
      required: [rootUnit, totalUnits, totalMembers]

    # ─── Summary ───────────────────────────────────────────────────
    UnitSummary:
      type: object
      properties:
        unitId:
          type: string
          format: uuid
        unitName:
          type: string
        totalMembers:
          type: integer
        claimedMembers:
          type: integer
        unclaimedMembers:
          type: integer
        claimRate:
          type: number
          description: Percentage of members who have claimed their profile (0–100)
        linkedUnits:
          type: integer
        pendingInvites:
          type: integer
        pendingLinkRequests:
          type: integer
        birthdayCount:
          type: integer
          description: Members with a birthday this month
        phoneCount:
          type: integer
          description: Members with a phone number on file
      required:
        - unitId
        - unitName
        - totalMembers
        - claimedMembers
        - unclaimedMembers
        - claimRate
        - linkedUnits
        - pendingInvites
        - pendingLinkRequests
        - birthdayCount
        - phoneCount

    BirthdayEntry:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        photoUrl:
          type: string
          nullable: true
        relationshipLabel:
          type: string
        viewerRelationshipLabel:
          type: string
          description: >-
            The birthday person's relationship to the currently-authenticated
            viewer, computed on read. Omitted for cross-linked-unit entries --
            callers should fall back to relationshipLabel.
        birthday:
          type: string
        showBirthYear:
          type: boolean
        unitName:
          type: string
        daysUntil:
          type: integer
          description: Days until their next birthday
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - personId
        - firstName
        - lastName
        - relationshipLabel
        - birthday
        - showBirthYear
        - unitName
        - daysUntil

    # ─── Life Events ───────────────────────────────────────────────
    LifeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [graduation, marriage, new_baby, moved, new_job, death, custom]
        eventDate:
          type: string
          description: Date in YYYY-MM-DD format
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
          nullable: true
      required: [id, familyId, personId, eventType, eventDate, createdAt]

    CreateLifeEventBody:
      type: object
      properties:
        eventType:
          type: string
          enum: [graduation, marriage, new_baby, moved, new_job, death, custom]
        eventDate:
          type: string
          description: Date in YYYY-MM-DD format
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        notes:
          type: string
          nullable: true
          maxLength: 500
      required: [eventType, eventDate]

    UpdateLifeEventBody:
      type: object
      properties:
        eventType:
          type: string
          enum: [graduation, marriage, new_baby, moved, new_job, death, custom]
        eventDate:
          type: string
          description: Date in YYYY-MM-DD format
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        notes:
          type: string
          nullable: true
          maxLength: 500

    # ─── Memories ──────────────────────────────────────────────────
    Memory:
      type: object
      description: Raw memory row, as returned from create/update.
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        familyUnitId:
          type: string
          format: uuid
        contributorPersonId:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        photoUrls:
          type: array
          items:
            type: string
          description: >-
            Inline data: URIs only (client-side resized before upload) --
            never raw external URLs. At most 3.
        promptText:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, personId, familyUnitId, body, photoUrls, createdAt, updatedAt]

    MemoryWithContributor:
      type: object
      description: Shape returned by the list-memories endpoint, enriched for display.
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        body:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        promptText:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contributorPersonId:
          type: string
          format: uuid
          nullable: true
        contributorName:
          type: string
          description: Contributor's full name, or "A family member" if they've since left the unit
        contributorRelationship:
          type: string
          nullable: true
          description: The contributor's relationship to the viewer, if computable
        canEdit:
          type: boolean
          description: True only for the memory's own contributor
        canDelete:
          type: boolean
          description: True for the contributor or a same-family admin
      required:
        - id
        - personId
        - body
        - photoUrls
        - createdAt
        - updatedAt
        - contributorName
        - canEdit
        - canDelete

    CreateMemoryBody:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
        photoUrls:
          type: array
          maxItems: 3
          items:
            type: string
            description: Must be an inline "data:image/...;base64," URI
        promptText:
          type: string
          nullable: true
      required: [body]

    UpdateMemoryBody:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
        photoUrls:
          type: array
          maxItems: 3
          items:
            type: string
            description: Must be an inline "data:image/...;base64," URI

    SetMemoryCollectionBody:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    MemoryCollectionToggleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        memoryCollectionEnabled:
          type: boolean
      required: [id, memoryCollectionEnabled]

    # ─── Home Feed ─────────────────────────────────────────────────
    HomeFeedBirthdayEntry:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        initials:
          type: string
        birthMonth:
          type: integer
        birthDay:
          type: integer
        daysUntil:
          type: integer
          description: 0-30 for upcoming; 358-364 for a birthday in the past 7 days
        ageTurning:
          type: integer
          nullable: true
          description: Null when birth year is a placeholder or hidden (showBirthYear false)
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - memberId
        - firstName
        - lastName
        - initials
        - birthMonth
        - birthDay
        - daysUntil

    HomeFeedRecentUpdate:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        name:
          type: string
        changeType:
          type: string
          enum: [joined, photo, phone, address, profile]
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        avatarUrl:
          type: string
          nullable: true
        initials:
          type: string
      required: [memberId, name, changeType, description, timestamp, initials]

    HomeFeedResponse:
      type: object
      properties:
        member:
          type: object
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            profileCompleteness:
              type: integer
              description: 0-100, +20 for each of phone/photo/email/birthday plus a 20 base
            missingPriorityField:
              type: string
              nullable: true
              enum: [phone, photo, email, birthday]
          required: [id, firstName, profileCompleteness, missingPriorityField]
        family:
          type: object
          properties:
            unitName:
              type: string
          required: [unitName]
        upcomingBirthdays:
          type: array
          items:
            $ref: "#/components/schemas/HomeFeedBirthdayEntry"
        stats:
          type: object
          properties:
            birthdaysThisMonth:
              type: integer
            newContactsCount:
              type: integer
              description: Visible members (excluding viewer) created in the last 30 days
          required: [birthdaysThisMonth, newContactsCount]
        recentUpdates:
          type: array
          items:
            $ref: "#/components/schemas/HomeFeedRecentUpdate"
      required: [member, family, upcomingBirthdays, stats, recentUpdates]

    # ─── AI ────────────────────────────────────────────────────────
    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]

    AiChatBody:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessage"
        unitId:
          type: string
          format: uuid
          description: Must match the caller's own family unit
      required: [messages, unitId]

    AiChatResponse:
      type: object
      properties:
        reply:
          type: string
        memberAdded:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        memberUpdated:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        lifeEventAdded:
          type: object
          nullable: true
          properties:
            personName:
              type: string
            eventType:
              type: string
          required: [personName, eventType]
        memoryAdded:
          type: object
          nullable: true
          properties:
            personName:
              type: string
          required: [personName]
        memberDeleted:
          type: object
          nullable: true
          properties:
            name:
              type: string
          required: [name]
      required: [reply, memberAdded, memberUpdated, lifeEventAdded, memoryAdded, memberDeleted]

    # ─── Invite Flow (phase 2) ─────────────────────────────────────
    InviteTokenCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        url:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, token, url, createdAt]

    InviteTokenDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        useCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, token, url, expiresAt, maxUses, useCount, createdAt]

    InviteTokenActiveResponse:
      type: object
      properties:
        active:
          allOf:
            - $ref: "#/components/schemas/InviteTokenDetails"
          nullable: true
      required: [active]

    JoinTokenInfo:
      type: object
      properties:
        family:
          type: object
          properties:
            unitName:
              type: string
          required: [unitName]
        inviter:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
            lastName:
              type: string
          required: [firstName, lastName]
      required: [family, inviter]

    ClaimRelationshipAnswers:
      type: object
      description: Optional disambiguation answers used to narrow candidate matches.
      properties:
        parentIds:
          type: array
          items:
            type: string
            format: uuid
        spouseId:
          type: string
          format: uuid

    ClaimsMatchBody:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
          minLength: 2
        relationshipAnswers:
          $ref: "#/components/schemas/ClaimRelationshipAnswers"
      required: [token, name]

    ClaimCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        parents:
          type: array
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              firstName:
                type: string
            required: [id, firstName]
        spouse:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
          required: [id, firstName]
        birthYear:
          type: integer
          nullable: true
      required: [id, firstName, lastName, parents, spouse, birthYear]

    ClaimsMatchResponse:
      type: object
      properties:
        overflow:
          type: boolean
          description: True if more than 4 candidates matched (candidates list is capped at 4)
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ClaimCandidate"
      required: [overflow, candidates]

    ClaimAttachingRelationship:
      type: object
      properties:
        relatedPersonId:
          type: string
          format: uuid
        type:
          type: string
          description: >-
            One of the relationship-edge types (e.g. spouse, partner,
            biological_parent, adoptive_parent, step_parent). Only
            meaningful for type = create_new.
      required: [relatedPersonId, type]

    CreateClaimBody:
      type: object
      description: >-
        For type = claim_existing, targetPersonId is required. For type =
        create_new, attachingRelationships may be supplied instead.
      properties:
        token:
          type: string
        type:
          type: string
          enum: [claim_existing, create_new]
        targetPersonId:
          type: string
          format: uuid
          description: Required when type is claim_existing
        claimerEmail:
          type: string
          format: email
        claimerPassword:
          type: string
          minLength: 8
        claimerName:
          type: string
        relationshipAnswers:
          $ref: "#/components/schemas/ClaimRelationshipAnswers"
        attachingRelationships:
          type: array
          items:
            $ref: "#/components/schemas/ClaimAttachingRelationship"
      required: [token, type, claimerEmail, claimerPassword, claimerName]

    ClaimCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, superseded]
        createdAt:
          type: string
          format: date-time
      required: [id, status, createdAt]

    ClaimStatusResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, superseded]
        type:
          type: string
          enum: [claim_existing, create_new]
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, status, type, createdAt]

    ClaimInboxEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [claim_existing, create_new]
        targetPersonId:
          type: string
          format: uuid
          nullable: true
        claimerDisplayName:
          type: string
        claimerContact:
          type: string
          nullable: true
        claimerSignal:
          type: object
          additionalProperties: true
          description: >-
            Sanitized claimer_signal JSONB (passwordHash stripped) --
            typically contains relationshipAnswers, attachingRelationships,
            arrival, and (for rejected claims) rejectionReason.
        status:
          type: string
          enum: [pending, approved, rejected, superseded]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - claimerDisplayName
        - claimerSignal
        - status
        - createdAt

    ClaimsInboxResponse:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/ClaimInboxEntry"
      required: [claims]

    ClaimApproveResponse:
      type: object
      properties:
        ok:
          type: boolean
        personId:
          type: string
          format: uuid
        token:
          type: string
          nullable: true
          description: JWT for the newly-bound person, so they're logged in immediately
      required: [ok, personId, token]

    RejectClaimBody:
      type: object
      properties:
        reason:
          type: string
          nullable: true
